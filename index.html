<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#175e54" />
    <title>greetings</title>
    <script>
      // Pre-paint theme resolution (no flash); the app owns theme after load.
      // The strict CSP injected by the build admits this inline script by its
      // exact sha256 hash (computed from this content), so it can never drift.
      (function () {
        try {
          var m = localStorage.getItem('theme');
          var dark =
            m === 'dark' ||
            (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
